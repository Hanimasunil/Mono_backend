{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <main class="col-md-12">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">{{ page_title }}</h1>
      </div>

      <div class="row">
        <div class="col-md-8">
          <div class="card border-danger">
            <div class="card-header bg-danger text-white">
              <h5 class="card-title mb-0">⚠️ Warning</h5>
            </div>
            <div class="card-body">
              <p>Are you sure you want to delete the service <strong>"{{ service.name }}"</strong>?</p>
              <p class="text-danger">This action cannot be undone.</p>
              
              <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                  <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Yes, Delete Service
                  </button>
                  <a href="{% url 'dashboard:service_list_admin' %}" class="btn btn-secondary">
                    <i class="bi bi-x"></i> Cancel
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
{% endblock %}
