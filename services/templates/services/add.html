{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <main class="col-md-12">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">{{ page_title }}</h1>
      </div>

      <div class="row">
        <div class="col-md-8">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
              <label for="name" class="form-label">Service Name *</label>
              <input type="text" class="form-control" id="name" name="name" value="{{ service.name|default:'' }}" required>
            </div>
            
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" name="description" rows="4">{{ service.description|default:'' }}</textarea>
            </div>
            
            <div class="mb-3">
              <label for="icon" class="form-label">Service Icon</label>
              <input type="file" class="form-control" id="icon" name="icon" accept="image/*">
              {% if service.icon %}
                <div class="mt-2">
                  <p>Current icon:</p>
                  <img src="{{ service.icon.url }}" alt="{{ service.name }}" class="img-thumbnail" style="max-width: 100px; max-height: 100px;">
                </div>
              {% endif %}
            </div>
            
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="is_active" name="is_active" value="True" {% if service.is_active %}checked{% endif %}>
              <label class="form-check-label" for="is_active">Active</label>
            </div>
            
            <button type="submit" class="btn btn-primary">Save Service</button>
            <a href="{% url 'dashboard:service_list_admin' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
{% endblock %}
