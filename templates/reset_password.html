{% extends 'base.html' %}

{% block title %}Reset Password - Admin Portal{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <h3 class="card-title">Set New Password</h3>
            <p class="text-muted">Create a strong password for your account</p>
          </div>

          {% if error %}
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          {% endif %}

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="password" class="form-label">New Password</label>
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                name="password" 
                required
                minlength="8"
                placeholder="Enter new password"
              >
              <div class="form-text">Must be at least 8 characters long</div>
            </div>

            <div class="mb-3">
              <label for="confirm_password" class="form-label">Confirm Password</label>
              <input 
                type="password" 
                class="form-control" 
                id="confirm_password" 
                name="confirm_password" 
                required
                placeholder="Confirm new password"
              >
            </div>
            
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Reset Password</button>
            </div>
          </form>

          <div class="text-center mt-3">
            <small class="text-muted">
              <a href="{% url 'dashboard:admin_login' %}">Back to Login</a>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.card {
  border: none;
  border-radius: 10px;
}

.card-title {
  color: #333;
  font-weight: 600;
}

.btn-primary {
  background-color: #0d6efd;
  border-color: #0d6efd;
}

.btn-primary:hover {
  background-color: #0b5ed7;
  border-color: #0a58ca;
}

.password-strength {
  height: 5px;
  background-color: #e9ecef;
  border-radius: 3px;
  margin-top: 5px;
  overflow: hidden;
}

.strength-meter {
  height: 100%;
  width: 0%;
  transition: width 0.3s ease;
}

.strength-weak { background-color: #dc3545; width: 33%; }
.strength-medium { background-color: #ffc107; width: 66%; }
.strength-strong { background-color: #198754; width: 100%; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirm_password');
  const strengthMeter = document.createElement('div');
  strengthMeter.className = 'password-strength';
  strengthMeter.innerHTML = '<div class="strength-meter"></div>';
  
  passwordInput.parentNode.appendChild(strengthMeter);
  const meter = strengthMeter.querySelector('.strength-meter');

  function checkPasswordStrength(password) {
    let strength = 0;
    
    if (password.length >= 8) strength++;
    if (/[a-z]/.test(password)) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^A-Za-z0-9]/.test(password)) strength++;
    
    return Math.min(strength, 4);
  }

  function updateStrengthIndicator() {
    const password = passwordInput.value;
    const strength = checkPasswordStrength(password);
    
    meter.className = 'strength-meter';
    if (password.length > 0) {
      if (strength <= 2) {
        meter.classList.add('strength-weak');
      } else if (strength <= 3) {
        meter.classList.add('strength-medium');
      } else {
        meter.classList.add('strength-strong');
      }
    }
  }

  passwordInput.addEventListener('input', updateStrengthIndicator);

  // Confirm password validation
  confirmPasswordInput.addEventListener('input', function() {
    if (this.value !== passwordInput.value && this.value.length > 0) {
      this.setCustomValidity('Passwords do not match');
    } else {
      this.setCustomValidity('');
    }
  });
});
</script>
{% endblock %}
