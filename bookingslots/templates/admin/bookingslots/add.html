{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <main class="col-md-12">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">{{ page_title }}</h1>
      </div>

      <div class="row">
        <div class="col-md-8">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="title" class="form-label">Title *</label>
              <input type="text" class="form-control" id="title" name="title" required>
            </div>
            
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" name="description" rows="4"></textarea>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="start_time" class="form-label">Start Date & Time *</label>
                  <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="end_time" class="form-label">End Date & Time *</label>
                  <input type="datetime-local" class="form-control" id="end_time" name="end_time" required>
                </div>
              </div>
            </div>
            
            <div class="mb-3">
              <label for="max_bookings" class="form-label">Maximum Bookings *</label>
              <input type="number" class="form-control" id="max_bookings" name="max_bookings" value="1" min="1" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Save Booking Slot</button>
            <a href="{% url 'booking_slot_list' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
{% endblock %}
