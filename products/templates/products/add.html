{% extends 'base.html' %}

{% block title %}Add Product - Admin{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title">{{ page_title }}</h4>
          <p class="card-subtitle text-muted">{{ page_subtitle }}</p>
        </div>
        <div class="card-body">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="name" class="form-label">Name *</label>
                  <input type="text" class="form-control" id="name" name="name" required>
                </div>
                
                <div class="mb-3">
                  <label for="price" class="form-label">Price *</label>
                  <input type="number" step="0.01" class="form-control" id="price" name="price" required>
                </div>
                
                <div class="mb-3">
                  <label for="image" class="form-label">Image</label>
                  <input type="file" class="form-control" id="image" name="image" accept="image/*">
                  <div class="form-text">Upload product image (optional)</div>
                </div>
              </div>
              
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="description" class="form-label">Description *</label>
                  <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                </div>
                
                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="is_active" name="is_active" checked>
                  <label class="form-check-label" for="is_active">Active</label>
                  <div class="form-text">Uncheck to hide this product from public view</div>
                </div>
              </div>
            </div>
            
            <div class="mt-4">
              <button type="submit" class="btn btn-primary">Save Product</button>
              <a href="{% url 'dashboard:product_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
