{% extends 'base.html' %}

{% block title %}Edit Blog Post - Admin{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-12">
      <h2>Edit Blog Post</h2>
      <p class="text-muted">Update your blog post: {{ blog.title }}</p>
    </div>
  </div>

  <div class="row">
    <div class="col-md-8">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="card">
          <div class="card-body">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" name="title" value="{{ blog.title }}" required>
            </div>
            
            <div class="mb-3">
              <label for="short_description" class="form-label">Short Description</label>
              <textarea class="form-control" id="short_description" name="short_description" rows="3" required>{{ blog.short_description }}</textarea>
            </div>
            
            <div class="mb-3">
              <label for="content" class="form-label">Content</label>
              <textarea class="form-control" id="content" name="content" rows="10" required>{{ blog.content }}</textarea>
            </div>
            
            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select class="form-control" id="status" name="status">
                <option value="draft" {% if blog.status == 'draft' %}selected{% endif %}>Draft</option>
                <option value="published" {% if blog.status == 'published' %}selected{% endif %}>Published</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label for="seo_title" class="form-label">SEO Title</label>
              <input type="text" class="form-control" id="seo_title" name="seo_title" value="{{ blog.seo_title }}">
            </div>
            
            <div class="mb-3">
              <label for="seo_description" class="form-label">SEO Description</label>
              <textarea class="form-control" id="seo_description" name="seo_description" rows="2">{{ blog.seo_description }}</textarea>
            </div>
            
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Update Blog</button>
              <a href="{% url 'admin_blog_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
